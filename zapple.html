<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand-Controlled Dino</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px 12px;
            display: grid;
            place-items: center;
            background: #16181d;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .call-screen {
            width: min(900px, 100%);
            text-align: center;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            margin-bottom: 22px;
            color: #aeb4c0;
            font-size: 14px;
        }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border: 1px solid #383d47;
            border-radius: 16px;
            background: #292c33;
        }

        #camera,
        #handOverlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #handOverlay {
            pointer-events: none;
        }

        #game {
            position: absolute;
            z-index: 2;
            left: 50%;
            bottom: 14px;
            width: min(420px, 90%);
            height: 150px;
            transform: translateX(-50%);
            border: 2px solid rgba(255, 255, 255, .65);
            border-radius: 12px;
            background: rgba(20, 24, 30, .84);
        }

        #status {
            min-height: 24px;
            margin: 16px 0;
            color: #c9ccd3;
            font-size: 14px;
        }

        .controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        button {
            padding: 13px 20px;
            border: 0;
            border-radius: 999px;
            background: #3b3f48;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover:not(:disabled) {
            background: #505560;
        }

        button:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        #closeButton {
            background: #d83b45;
        }

        button i {
            margin-right: 8px;
        }

        @media (max-width: 480px) {
            .controls button {
                flex: 1;
            }

            #game {
                height: 125px;
            }
        }
    </style>
</head>

<body>
    <main class="call-screen">
        <h1>Hand-Controlled Dino</h1>
        <p class="subtitle">✊ Rock = duck · 🖐️ Paper = jump</p>

        <div class="video-container">
            <video id="camera" autoplay playsinline muted></video>
            <canvas id="handOverlay"></canvas>
            <canvas id="game" aria-label="Dino game"></canvas>
        </div>

        <p id="status" role="status" aria-live="polite">
            Camera is off. Open the camera to play.
        </p>

        <div class="controls">
            <button id="openButton" type="button">
                <i class="fa fa-video-camera" aria-hidden="true"></i>Open Camera
            </button>
            <button id="closeButton" type="button" disabled>
                <i class="fa fa-video-slash" aria-hidden="true"></i>Close Camera
            </button>
        </div>
    </main>

    <script type="module">
        import {
            FilesetResolver,
            HandLandmarker
        } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs";

        const video = document.querySelector("#camera");
        const handCanvas = document.querySelector("#handOverlay");
        const handCtx = handCanvas.getContext("2d");
        const gameCanvas = document.querySelector("#game");
        const gameCtx = gameCanvas.getContext("2d");
        const status = document.querySelector("#status");
        const openButton = document.querySelector("#openButton");
        const closeButton = document.querySelector("#closeButton");

        let stream = null;
        let handLandmarker = null;
        let detectFrameId = null;
        let gameFrameId = null;
        let opening = false;
        let lastVideoTime = -1;
        let gesture = "none";
        let lastAction = 0;

        const game = {
            dinoX: 42,
            dinoY: 0,
            dinoSize: 25,
            velocityY: 0,
            jumping: false,
            ducking: false,
            obstacles: [],
            score: 0,
            speed: 3,
            lastObstacle: 0,
            over: false
        };

        async function setupHandTracker() {
            status.textContent = "Loading hand tracking…";

            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/wasm"
            );

            const modelPath =
                "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";

            try {
                handLandmarker = await HandLandmarker.createFromOptions(vision, {
                    baseOptions: { modelAssetPath: modelPath, delegate: "GPU" },
                    runningMode: "VIDEO",
                    numHands: 1
                });
            } catch {
                handLandmarker = await HandLandmarker.createFromOptions(vision, {
                    baseOptions: { modelAssetPath: modelPath, delegate: "CPU" },
                    runningMode: "VIDEO",
                    numHands: 1
                });
            }
        }

        async function openCamera() {
            if (stream || opening) return;
            opening = true;
            openButton.disabled = true;

            try {
                if (!navigator.mediaDevices?.getUserMedia) {
                    throw new Error("Use HTTPS or localhost to access the camera.");
                }

                if (!handLandmarker) await setupHandTracker();

                stream = await navigator.mediaDevices.getUserMedia({
                    audio: false,
                    video: { facingMode: "user" }
                });

                video.srcObject = stream;
                await video.play();

                closeButton.disabled = false;
                status.textContent = "Show a fist to duck or an open palm to jump.";
                resetGame();
                detectFrame();
                gameLoop();
            } catch (error) {
                status.textContent = `Could not start: ${error.message}`;
                stream?.getTracks().forEach(track => track.stop());
                stream = null;
                openButton.disabled = false;
                closeButton.disabled = true;
            } finally {
                opening = false;
            }
        }

        // A finger is counted as extended when its tip is farther from the
        // wrist than its middle joint. This is a lightweight gesture heuristic.
        function classifyHand(points) {
            const wrist = points[0];
            const fingerPairs = [
                [8, 6],   // index
                [12, 10], // middle
                [16, 14], // ring
                [20, 18]  // pinky
            ];

            let extended = 0;

            for (const [tipIndex, middleIndex] of fingerPairs) {
                const tip = points[tipIndex];
                const middle = points[middleIndex];

                const tipDistance = Math.hypot(tip.x - wrist.x, tip.y - wrist.y);
                const middleDistance = Math.hypot(
                    middle.x - wrist.x,
                    middle.y - wrist.y
                );

                if (tipDistance > middleDistance * 1.12) extended++;
            }

            if (extended >= 3) return "paper";
            if (extended <= 1) return "rock";
            return "other";
        }

        function drawHand(points) {
            const connections = HandLandmarker.HAND_CONNECTIONS;
            handCtx.strokeStyle = "#00e5ff";
            handCtx.lineWidth = 3;
            handCtx.beginPath();

            for (const connection of connections) {
                const a = points[connection.start];
                const b = points[connection.end];
                if (!a || !b) continue;

                handCtx.moveTo(a.x * handCanvas.width, a.y * handCanvas.height);
                handCtx.lineTo(b.x * handCanvas.width, b.y * handCanvas.height);
            }

            handCtx.stroke();
            handCtx.fillStyle = "#fff";

            for (const point of points) {
                handCtx.beginPath();
                handCtx.arc(
                    point.x * handCanvas.width,
                    point.y * handCanvas.height,
                    3,
                    0,
                    Math.PI * 2
                );
                handCtx.fill();
            }
        }

        function detectFrame() {
            if (!stream) return;

            if (video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA &&
                video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;

                if (handCanvas.width !== video.videoWidth ||
                    handCanvas.height !== video.videoHeight) {
                    handCanvas.width = video.videoWidth;
                    handCanvas.height = video.videoHeight;
                }

                handCtx.clearRect(0, 0, handCanvas.width, handCanvas.height);

                const result = handLandmarker.detectForVideo(video, performance.now());
                const points = result.landmarks?.[0];

                gesture = points ? classifyHand(points) : "none";
                if (points) drawHand(points);

                status.textContent = points
                    ? `Hand detected: ${gesture === "other" ? "try a fist or open palm" : gesture}`
                    : "Show one hand to the camera.";
            }

            detectFrameId = requestAnimationFrame(detectFrame);
        }

        function resizeGame() {
            const rect = gameCanvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            gameCanvas.width = Math.round(rect.width * dpr);
            gameCanvas.height = Math.round(rect.height * dpr);
            gameCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function resetGame() {
            game.score = 0;
            game.speed = 3;
            game.obstacles = [];
            game.over = false;
            game.jumping = false;
            game.ducking = false;
            game.velocityY = 0;
            game.dinoY = 0;
            game.lastObstacle = performance.now();
        }

        function jump() {
            if (!game.jumping && !game.over) {
                game.jumping = true;
                game.velocityY = -9;
            }
        }

        function gameLoop(now = performance.now()) {
            if (!stream) return;

            resizeGame();
            const width = gameCanvas.clientWidth;
            const height = gameCanvas.clientHeight;
            const ground = height - 22;

            gameCtx.clearRect(0, 0, width, height);

            if (game.over) {
                gameCtx.fillStyle = "#fff";
                gameCtx.font = "bold 20px Arial";
                gameCtx.textAlign = "center";
                gameCtx.fillText("Game over — show 🖐️ to restart", width / 2, 35);
                gameCtx.font = "14px Arial";
                gameCtx.fillText(`Score: ${Math.floor(game.score)}`, width / 2, 58);
                gameFrameId = requestAnimationFrame(gameLoop);
                return;
            }

            // Require a new gesture action rather than repeatedly triggering
            // while the same hand shape is held.
            if (now - lastAction > 450) {
                if (gesture === "paper") {
                    if (game.over) resetGame();
                    jump();
                    lastAction = now;
                } else if (gesture === "rock") {
                    game.ducking = true;
                    lastAction = now;
                }
            }

            if (gesture !== "rock") game.ducking = false;

            if (game.jumping) {
                game.dinoY += game.velocityY;
                game.velocityY += 0.48;

                if (game.dinoY >= 0) {
                    game.dinoY = 0;
                    game.jumping = false;
                }
            }

            if (now - game.lastObstacle > 1150 + Math.random() * 700) {
                game.obstacles.push({
                    x: width + 10,
                    w: 15 + Math.random() * 12,
                    h: 20 + Math.random() * 22
                });
                game.lastObstacle = now;
            }

            game.speed = Math.min(6, 3 + game.score / 500);
            game.obstacles.forEach(obstacle => obstacle.x -= game.speed);
            game.obstacles = game.obstacles.filter(o => o.x + o.w > 0);
            game.score += 0.15;

            // Ground
            gameCtx.strokeStyle = "#aeb4c0";
            gameCtx.beginPath();
            gameCtx.moveTo(0, ground);
            gameCtx.lineTo(width, ground);
            gameCtx.stroke();

            // Dino
            const dinoHeight = game.ducking ? 15 : game.dinoSize;
            const dinoY = ground - dinoHeight + game.dinoY;

            gameCtx.fillStyle = "#7ee787";
            gameCtx.fillRect(game.dinoX, dinoY, game.dinoSize, dinoHeight);
            gameCtx.fillRect(game.dinoX + 14, dinoY - 8, 15, 15);

            // Eye
            gameCtx.fillStyle = "#16181d";
            gameCtx.fillRect(game.dinoX + 24, dinoY - 3, 3, 3);

            // Obstacles and collision
            gameCtx.fillStyle = "#ff7676";
            for (const obstacle of game.obstacles) {
                const obstacleY = ground - obstacle.h;
                gameCtx.fillRect(obstacle.x, obstacleY, obstacle.w, obstacle.h);

                const dinoRight = game.dinoX + game.dinoSize;
                const obstacleRight = obstacle.x + obstacle.w;
                const dinoBottom = dinoY + dinoHeight;

                if (dinoRight > obstacle.x &&
                    game.dinoX < obstacleRight &&
                    dinoBottom > obstacleY) {
                    game.over = true;
                }
            }

            gameCtx.fillStyle = "#fff";
            gameCtx.font = "14px Arial";
            gameCtx.textAlign = "right";
            gameCtx.fillText(`Score: ${Math.floor(game.score)}`, width - 10, 20);

            gameFrameId = requestAnimationFrame(gameLoop);
        }

        function closeCamera() {
            if (detectFrameId) cancelAnimationFrame(detectFrameId);
            if (gameFrameId) cancelAnimationFrame(gameFrameId);

            stream?.getTracks().forEach(track => track.stop());
            stream = null;
            video.srcObject = null;
            handCtx.clearRect(0, 0, handCanvas.width, handCanvas.height);
            gameCtx.clearRect(0, 0, gameCanvas.width, gameCanvas.height);

            status.textContent = "Camera is off.";
            openButton.disabled = false;
            closeButton.disabled = true;
        }

        openButton.addEventListener("click", openCamera);
        closeButton.addEventListener("click", closeCamera);
        window.addEventListener("resize", resizeGame);
        window.addEventListener("pagehide", closeCamera);
    </script>
</body>

</html>
